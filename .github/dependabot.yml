# Only the actions are watched: Dependabot has no Pkg ecosystem, and the
# Julia dependencies are a registered `[compat]` floor (TreeAMR, TreeIOHDF5)
# or GitHub `main` through `[sources]` (SpacetimeMetrics, IMEXRungeKutta).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
